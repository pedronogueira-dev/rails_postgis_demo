<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sensor geography validation — temporary public page</title>
    <link
      rel="stylesheet"
      href="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.css"
    />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.js"></script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #validation-map {
        width: 100%;
        height: 100vh;
      }
      #validation-panel {
        position: absolute;
        z-index: 10;
        top: 12px;
        left: 12px;
        max-width: 340px;
        max-height: calc(100vh - 36px);
        overflow: auto;
        padding: 12px;
        border-radius: 8px;
        background: white;
        font:
          14px system-ui,
          sans-serif;
        box-shadow: 0 2px 12px #0003;
      }
    </style>
  </head>
  <body>
    <div id="validation-map"></div>
    <aside id="validation-panel">
      <strong>Temporary Sensor/PostGIS read check</strong>
      <p id="validation-status">Loading Mapbox and Sensor GeoJSON...</p>
      <ul id="validation-nearby"></ul>
    </aside>
    <script>
      const status = document.querySelector("#validation-status");
      const nearbyList = document.querySelector("#validation-nearby");
      const empty = { type: "FeatureCollection", features: [] };

      async function getJson(url) {
        const response = await fetch(url, {
          headers: { Accept: "application/json" },
        });
        if (!response.ok) throw new Error(`${response.status} ${url}`);
        return response.json();
      }

      async function start() {
        const config = await getJson("/maps/config");
        if (!config.mapbox_public_token?.startsWith("pk.")) {
          throw new Error("Configure a real public MAPBOX_PUBLIC_TOKEN");
        }

        const map = new mapboxgl.Map({
          container: "validation-map",
          accessToken: config.mapbox_public_token,
          style: "mapbox://styles/mapbox/standard",
          center: [-9.14, 38.72],
          zoom: 12,
        });

        map.on("error", (event) =>
          console.error("Mapbox validation error:", event.error),
        );

        map.on("load", async () => {
          try {
            const sensors = await getJson(config.sensors_url);
            if (
              sensors.type !== "FeatureCollection" ||
              !Array.isArray(sensors.features)
            ) {
              throw new Error(
                "GET /api/sensors did not return a GeoJSON FeatureCollection",
              );
            }

            map.addSource("sensors", { type: "geojson", data: sensors });
            map.addSource("nearby", { type: "geojson", data: empty });
            map.addSource("search-area", { type: "geojson", data: empty });

            map.addLayer({
              id: "search-area-fill",
              type: "fill",
              source: "search-area",
              paint: { "fill-color": "#2563eb", "fill-opacity": 0.12 },
            });
            map.addLayer({
              id: "sensor-points",
              type: "circle",
              source: "sensors",
              paint: { "circle-radius": 7, "circle-color": "#334155" },
            });
            map.addLayer({
              id: "nearby-points",
              type: "circle",
              source: "nearby",
              paint: { "circle-radius": 10, "circle-color": "#dc2626" },
            });
            status.textContent = `${sensors.features.length} Sensors loaded. Click anywhere to query nearby.`;
          } catch (error) {
            status.textContent = error.message;
            console.error(error);
          }
        });

        map.on("click", async (event) => {
          if (!map.getSource("nearby")) return;

          const query = new URLSearchParams({
            longitude: String(event.lngLat.lng),
            latitude: String(event.lngLat.lat),
            radius_m: "1000",
          });

          try {
            const data = await getJson(`${config.nearby_sensors_url}?${query}`);
            map.getSource("nearby").setData(data.sensors);
            map.getSource("search-area").setData(data.search_area);
            nearbyList.replaceChildren(
              ...data.sensors.features.map((feature) => {
                const li = document.createElement("li");
                li.textContent = feature.properties.name;
                return li;
              }),
            );
            status.textContent = `${data.sensors.features.length} Sensors within 1,000 m.`;
          } catch (error) {
            status.textContent = error.message;
            console.error(error);
          }
        });
      }

      start().catch((error) => {
        status.textContent = error.message;
        console.error(error);
      });
    </script>
  </body>
</html>
